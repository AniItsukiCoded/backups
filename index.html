
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Itsukis Chat Hub Launcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgo=">
<style>
/* ======================================================================
   Itsukis Chat Hub Launcher
   Theme colours live in --a --b --c --g1 --g2 (set by the theme engine, animated by @property)
   ====================================================================== */
@property --a{syntax:'<color>';inherits:true;initial-value:#7c6cff}
@property --b{syntax:'<color>';inherits:true;initial-value:#ff6cb4}
@property --c{syntax:'<color>';inherits:true;initial-value:#5a4bff}
@property --g1{syntax:'<color>';inherits:true;initial-value:#0b0c1a}
@property --g2{syntax:'<color>';inherits:true;initial-value:#14152b}
@property --vipA{syntax:'<angle>';initial-value:0deg;inherits:false}
:root{
  --a:#7c6cff;--b:#ff6cb4;--c:#5a4bff;--g1:#0b0c1a;--g2:#14152b;
  --text:#eef0ff;--muted:#9a9dc4;--panel:rgba(15,16,22,.58);--panel2:rgba(26,27,40,.8);
  --bd:rgba(255,255,255,.14);--ok:#4cd6a0;--bad:#ff5d73;--spring:cubic-bezier(.22,1,.36,1);
  transition:--a .9s ease,--b .9s ease,--c .9s ease,--g1 .9s ease,--g2 .9s ease;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--g1);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
::selection{background:color-mix(in srgb,var(--a) 50%,transparent)}
.hidden,[hidden]{display:none!important}
kbd{font:600 11px ui-monospace,monospace;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.1);border:1px solid var(--bd)}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.975)}}
@keyframes fade{from{opacity:0}}
@keyframes float{50%{translate:0 -7px}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes popIn{from{opacity:0;transform:translateY(-8px) scale(.94)}}
@keyframes beat{40%{transform:scale(1.35)}}

/* ---------- background layers ---------- */
.bgfx{position:fixed;inset:0;z-index:-4;pointer-events:none;
  background:radial-gradient(1000px 640px at 10% -8%,color-mix(in srgb,var(--a) 32%,transparent),transparent 58%),
             radial-gradient(900px 600px at 96% 8%,color-mix(in srgb,var(--b) 20%,transparent),transparent 58%),
             linear-gradient(160deg,var(--g1),var(--g2))}
.bgx{position:fixed;inset:0;z-index:-3;pointer-events:none;background:var(--bgx,none);opacity:1;transition:opacity .6s}
#fx{position:fixed;inset:0;z-index:-2;width:100%;height:100%;pointer-events:none}
#deco{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;opacity:1;transition:opacity .35s}
#deco.out{opacity:0}
.flash{position:fixed;z-index:900;width:30px;height:30px;margin:-15px;border-radius:50%;pointer-events:none;animation:flash 1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes flash{from{transform:scale(0);opacity:.9}to{transform:scale(90);opacity:0}}

/* ---------- decorations ---------- */
.dc{position:absolute;opacity:.55;filter:drop-shadow(0 0 22px var(--a));animation:float 6s ease-in-out infinite}
.hang{position:absolute;top:0;display:flex;flex-direction:column;align-items:center;transform-origin:top center;animation:swing 4.6s ease-in-out infinite}
.hang u{display:block;width:1px;height:var(--l);background:rgba(255,255,255,.3)}
.hang b{font-weight:400;font-size:var(--s,26px);filter:drop-shadow(0 0 12px var(--a))}
@keyframes swing{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.lights{position:absolute;top:-2px;left:0;right:0;height:46px;display:flex;justify-content:space-around;pointer-events:none}
.lights::before{content:"";position:absolute;left:-2%;right:-2%;top:-14px;height:34px;border-bottom:2px solid rgba(255,255,255,.18);border-radius:50%}
.lights i{position:relative;width:11px;height:16px;border-radius:50% 50% 55% 55%;background:var(--lc);box-shadow:0 0 14px 3px var(--lc);margin-top:8px;animation:twinkle 2.4s ease-in-out var(--ld) infinite}
.lights i:nth-child(3n+1){margin-top:14px}.lights i:nth-child(3n+2){margin-top:5px}
@keyframes twinkle{0%,100%{opacity:1;filter:brightness(1.15)}50%{opacity:.35;filter:brightness(.7)}}
.rbar{position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,#ff3b3b,#ff9f1c,#ffe14d,#38d96b,#35a8ff,#9b5cff,#ff3bb0,#ff3b3b);background-size:200% 100%;animation:rbar 6s linear infinite}
@keyframes rbar{to{background-position:200% 0}}
.aur{position:absolute;inset:-20% -10% auto;height:70%;filter:blur(40px);opacity:.55;background:linear-gradient(100deg,transparent 10%,rgba(74,222,128,.55) 30%,rgba(56,189,248,.5) 50%,rgba(167,139,250,.5) 70%,transparent 90%);animation:aur 14s ease-in-out infinite alternate}
.aur.b{height:50%;opacity:.35;animation-duration:20s;animation-direction:alternate-reverse}
@keyframes aur{from{transform:translateX(-8%) skewX(-8deg)}to{transform:translateX(8%) skewX(8deg)}}
.grid3d{position:absolute;left:-50%;right:-50%;bottom:-6%;height:46%;opacity:.5;transform:perspective(380px) rotateX(62deg);transform-origin:bottom;
  background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--a) 70%,transparent) 0 1px,transparent 1px 60px),repeating-linear-gradient(0deg,color-mix(in srgb,var(--b) 70%,transparent) 0 1px,transparent 1px 48px);
  -webkit-mask:linear-gradient(0deg,#000,transparent);mask:linear-gradient(0deg,#000,transparent);animation:gridmove 3s linear infinite}
@keyframes gridmove{to{background-position:0 48px,0 48px}}

/* ---------- Halloween scenery (copied from the main site) ---------- */
.hw-deco{position:absolute;inset:0;pointer-events:none;overflow:hidden;contain:layout paint style;opacity:0;transition:opacity .8s ease}
.hw-deco.in{opacity:1}
.hw-deco .hw-moon{scale:.2;transition:scale 1s var(--spring) .15s}
.hw-deco.in .hw-moon{scale:1}
.hw-deco .hw-web{opacity:0;transition:translate .9s var(--spring) .1s,opacity .6s ease .1s}
.hw-deco .hw-web.l{translate:-50px -50px}.hw-deco .hw-web.r{translate:50px -50px}
.hw-deco.in .hw-web{translate:0 0;opacity:1}
.hw-deco .hw-sp{translate:0 -130%;transition:translate 1.1s var(--spring) .3s}
.hw-deco.in .hw-sp{translate:0 0}
.hw-deco .hw-pk{translate:0 90px;transition:translate .8s var(--spring) .35s}
.hw-deco.in .hw-pk{translate:0 0}
.hw-vig{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 115%,rgba(255,110,20,.16),transparent 55%),radial-gradient(90% 70% at 100% 0,rgba(140,60,255,.16),transparent 60%),radial-gradient(70% 60% at 0 0,rgba(255,120,30,.09),transparent 60%)}
.hw-moon{position:absolute;top:19vh;right:3%;width:60px;aspect-ratio:1;border-radius:50%;opacity:.55;animation:hwMoon 8s ease-in-out infinite;background:radial-gradient(circle at 30% 30%,#fff8dc,#ffd98a 58%,#e9a24a);box-shadow:0 0 34px 10px rgba(255,190,90,.26),0 0 90px 30px rgba(255,150,40,.12)}
.hw-moon::before{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 62% 38%,rgba(170,110,40,.35) 0 7%,transparent 8%),radial-gradient(circle at 38% 66%,rgba(170,110,40,.3) 0 10%,transparent 11%),radial-gradient(circle at 70% 70%,rgba(170,110,40,.25) 0 5%,transparent 6%)}
@keyframes hwMoon{50%{transform:translate3d(0,-6px,0)}}
.hw-web{position:absolute;top:0;width:150px;height:150px;color:rgba(255,255,255,.17)}
.hw-web.l{left:0}.hw-web.r{right:0;transform:scaleX(-1)}
.hw-web svg{width:100%;height:100%}
.hw-sp{position:absolute;top:0;left:var(--x);display:flex;flex-direction:column;align-items:center;transform-origin:top center;animation:swing 4.5s ease-in-out infinite}
.hw-sp u{display:block;width:1px;height:var(--l);background:rgba(255,255,255,.3)}
.hw-sp b{font-size:18px;font-weight:400}
.hw-bat{position:absolute;left:-70px;top:var(--y);font-size:var(--s);animation:hwBat var(--d) linear var(--t) infinite;opacity:.7;will-change:transform}
.hw-bat i{display:block;font-style:normal;animation:hwFlap .3s ease-in-out infinite alternate}
@keyframes hwFlap{from{transform:scale(1,1)}to{transform:scale(.55,1.1)}}
@keyframes hwBat{0%{transform:translate3d(0,0,0) rotate(-6deg)}25%{transform:translate3d(28vw,-34px,0) rotate(8deg)}50%{transform:translate3d(58vw,20px,0) rotate(-8deg)}75%{transform:translate3d(86vw,-26px,0) rotate(7deg)}100%{transform:translate3d(118vw,6px,0) rotate(-4deg)}}
.hw-gh{position:absolute;bottom:-60px;left:var(--x);font-size:30px;opacity:0;animation:hwGh var(--d) ease-in-out var(--t) infinite;will-change:transform,opacity}
@keyframes hwGh{0%{transform:translate3d(0,0,0);opacity:0}12%{opacity:.5}50%{transform:translate3d(36px,-55vh,0)}88%{opacity:.35}100%{transform:translate3d(-24px,-112vh,0);opacity:0}}
.hw-em{position:absolute;bottom:-10px;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;background:#ffb347;box-shadow:0 0 8px 2px rgba(255,140,40,.7);opacity:0;animation:hwEm var(--d) linear var(--t) infinite}
@keyframes hwEm{0%{transform:translate3d(0,0,0) scale(1);opacity:0}10%{opacity:.8}100%{transform:translate3d(var(--dx),-95vh,0) scale(.3);opacity:0}}
.hw-pk{position:absolute;bottom:6px;font-size:34px;line-height:1;opacity:.9;text-shadow:0 0 16px rgba(255,130,20,.8);animation:hwPk 2.8s ease-in-out infinite}
.hw-pk.l{left:8px}.hw-pk.r{right:8px;animation-delay:-1.4s}
@keyframes hwPk{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-4px,0)}}
.hw-fog{position:absolute;left:-20%;bottom:-40px;width:140%;height:180px;animation:hwFog 26s ease-in-out infinite alternate;will-change:transform;background:radial-gradient(50% 100% at 30% 100%,rgba(200,170,255,.13),transparent 70%),radial-gradient(40% 90% at 72% 100%,rgba(255,170,100,.1),transparent 70%)}
.hw-fog.f2{animation-duration:36s;animation-direction:alternate-reverse;opacity:.7}
@keyframes hwFog{from{transform:translate3d(-6%,0,0)}to{transform:translate3d(6%,0,0)}}
.hw-pop{position:fixed;top:var(--y);left:var(--x);z-index:950;font-size:26px;pointer-events:none;animation:hwPopUp 1.6s ease-out forwards}
@keyframes hwPopUp{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),-170px) scale(1.4) rotate(var(--r))}}
@media (max-width:700px){.hw-x{display:none}.hw-web{width:90px;height:90px}.hw-moon{width:42px}.hw-pk{font-size:26px}.dc{transform:scale(.7)}}

/* ---------- layout ---------- */
.shell{max-width:1040px;margin:0 auto;padding:14px 22px 28px;min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:2}
.nav{position:sticky;top:12px;z-index:30;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;border-radius:22px;background:var(--panel);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);border:1px solid var(--bd);box-shadow:0 12px 40px rgba(0,0,0,.35),inset 0 1.5px 0 rgba(255,255,255,.12);animation:drop .6s var(--spring) both}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.brand .bi{width:34px;height:34px;border-radius:50%;overflow:hidden;border:1px solid var(--bd);box-shadow:0 0 18px color-mix(in srgb,var(--a) 45%,transparent);display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--b));font-size:18px}
.brand img{width:100%;height:100%;object-fit:cover;display:block}
.brand b{font-size:15px}
.tabs{position:relative;display:flex;gap:2px;margin:0 auto;padding:4px;border-radius:16px;background:rgba(0,0,0,.28)}
.tabs button{position:relative;z-index:1;display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:12px;font-size:14px;font-weight:600;color:var(--muted);transition:color .25s}
.tabs button.on,.tabs button:hover{color:#fff}
.tabs em{font-style:normal;font-size:11px;min-width:18px;padding:1px 6px;border-radius:10px;background:rgba(255,255,255,.22)}
.tabs em:empty{display:none}
.ind{position:absolute;left:0;top:4px;bottom:4px;border-radius:12px;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 6px 20px color-mix(in srgb,var(--a) 45%,transparent);transition:transform .5s var(--spring),width .5s var(--spring)}
.tbtn{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid var(--bd);font-size:13.5px;font-weight:700;white-space:nowrap;transition:.3s var(--spring)}
.tbtn:hover{transform:translateY(-2px);border-color:var(--a)}
.tbtn em{font-style:normal;font-size:9.5px;letter-spacing:.08em;padding:2px 6px;border-radius:8px;background:linear-gradient(135deg,var(--a),var(--b))}
.tbtn s{text-decoration:none;opacity:.6;font-size:11px}
@media(max-width:760px){.brand b,.tabs b,.tbtn b,.tbtn em{display:none}.tabs button{padding:9px 12px}.nav{gap:6px;padding:8px}.shell{padding:10px 14px 24px}}

.sv{display:none}
.sv.on{display:block;animation:svin .5s cubic-bezier(.22,1,.36,1) backwards}
.sv.leaving{display:block;position:absolute;left:0;right:0;top:0;pointer-events:none;animation:svout .22s cubic-bezier(.4,0,.6,1) forwards}
@keyframes svin{from{opacity:0;transform:translate3d(var(--dx,0),14px,0) scale(.985)}}
@keyframes svout{to{opacity:0;transform:translate3d(var(--dx,0),-6px,0) scale(.99)}}
html.booting,html.booting body{overflow:hidden}
#boot{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;overflow:hidden;background:radial-gradient(900px 560px at 50% 18%,color-mix(in srgb,var(--a) 30%,transparent),transparent 60%),linear-gradient(160deg,var(--g1),var(--g2));color:#eef0ff;transition:opacity .5s ease,transform .6s cubic-bezier(.22,1,.36,1),filter .5s ease,visibility 0s .6s}
#boot.done{opacity:0;transform:scale(1.05);filter:blur(10px);visibility:hidden;pointer-events:none}
#boot .b-orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none;will-change:transform}
#boot .o1{width:46vmax;height:46vmax;left:-14vmax;top:-18vmax;background:var(--a);animation:orb1 9s ease-in-out infinite alternate}
#boot .o2{width:40vmax;height:40vmax;right:-14vmax;bottom:-16vmax;background:var(--b);opacity:.4;animation:orb1 11s ease-in-out infinite alternate-reverse}
#boot .o3{width:30vmax;height:30vmax;left:40%;top:55%;background:var(--c);opacity:.28;animation:orb1 13s ease-in-out infinite alternate}
@keyframes orb1{to{transform:translate3d(8vmax,5vmax,0) scale(1.15)}}
#boot .b-stars{position:absolute;inset:0;pointer-events:none;opacity:.7;background-image:radial-gradient(1.5px 1.5px at 12% 22%,#fff,transparent),radial-gradient(1px 1px at 28% 72%,#fff,transparent),radial-gradient(1.5px 1.5px at 44% 12%,#fff,transparent),radial-gradient(1px 1px at 63% 82%,#fff,transparent),radial-gradient(1.5px 1.5px at 78% 28%,#fff,transparent),radial-gradient(1px 1px at 90% 64%,#fff,transparent),radial-gradient(1px 1px at 6% 56%,#fff,transparent),radial-gradient(1.5px 1.5px at 56% 48%,#fff,transparent);animation:twk 3.2s ease-in-out infinite alternate}
@keyframes twk{from{opacity:.25}to{opacity:.85}}
#boot .bw{position:relative;text-align:center;padding:20px;animation:bootIn .6s cubic-bezier(.22,1,.36,1) both}
@keyframes bootIn{from{opacity:0;transform:translateY(14px) scale(.97)}}
#boot .bring{position:relative;width:108px;height:108px;margin:0 auto 30px}
#boot .bring span{position:absolute;border-radius:50%;pointer-events:none}
#boot .r1{inset:-9px;background:conic-gradient(from 0deg,transparent 0 26%,var(--a) 60%,var(--b));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));animation:spin 1s linear infinite;filter:drop-shadow(0 0 8px var(--a))}
#boot .r2{inset:-22px;border:1.5px dashed rgba(255,255,255,.22);animation:spin 9s linear infinite reverse}
#boot .r3{inset:-22px;animation:spin 2.6s linear infinite}
#boot .r3::before{content:"";position:absolute;left:50%;top:-4px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#fff;box-shadow:0 0 12px 3px var(--b),0 0 26px 6px var(--a)}
#boot .bring::after{content:"";position:absolute;inset:-9px;border-radius:50%;box-shadow:0 0 50px color-mix(in srgb,var(--a) 55%,transparent);animation:bootPulse 1.8s ease-in-out infinite;pointer-events:none}
@keyframes bootPulse{50%{box-shadow:0 0 84px color-mix(in srgb,var(--b) 60%,transparent)}}
#boot img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;box-shadow:0 14px 40px rgba(0,0,0,.55);animation:bootPop .7s cubic-bezier(.34,1.56,.64,1) both}
@keyframes bootPop{from{opacity:0;transform:scale(.55) rotate(-12deg)}}
#boot h1{display:inline-block;font:800 clamp(28px,6.5vw,42px)/1.1 Inter,system-ui,sans-serif;letter-spacing:-.03em;background:linear-gradient(100deg,#fff 0%,color-mix(in srgb,var(--a) 55%,#fff) 35%,color-mix(in srgb,var(--b) 70%,#fff) 60%,#fff 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:bootTitle .7s cubic-bezier(.22,1,.36,1) .12s both,gshift 2.4s linear infinite;filter:drop-shadow(0 6px 24px color-mix(in srgb,var(--a) 45%,transparent))}
@keyframes bootTitle{from{opacity:0;transform:translateY(12px);letter-spacing:.06em}}
#boot .bbar{width:min(250px,70vw);height:5px;margin:26px auto 16px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden;animation:bootIn .6s cubic-bezier(.22,1,.36,1) .2s both}
#boot .bbar i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,var(--a),var(--b));box-shadow:0 0 16px var(--b);transition:width .35s cubic-bezier(.3,.7,.2,1)}
#boot p{font:600 12.5px Inter,system-ui,sans-serif;letter-spacing:.07em;color:rgba(238,240,255,.62);animation:bootIn .6s cubic-bezier(.22,1,.36,1) .3s both}
html.booting .shell,html.booting .shell *,html.booting .shell *::before,html.booting .shell *::after{animation-play-state:paused!important}
.stage{flex:1}
.ph{margin:26px 0 16px}
.ph h2{font-size:clamp(26px,5vw,34px);letter-spacing:-.02em}
.ph p{color:var(--muted);margin-top:4px;font-size:14px}

/* ---------- hero ---------- */
.hero{text-align:center;padding:28px 0 6px}
.hero-icon{width:92px;height:92px;border-radius:50%;margin:0 auto 16px;overflow:hidden;border:1px solid var(--bd);display:grid;place-items:center;font-size:44px;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 18px 48px rgba(0,0,0,.5),0 0 46px color-mix(in srgb,var(--a) 50%,transparent);animation:drop .7s var(--spring) both,float 5s ease-in-out infinite}
.hero-icon img{width:100%;height:100%;object-fit:cover;display:block}
.logo{font-size:clamp(34px,8vw,54px);font-weight:800;letter-spacing:-.025em;line-height:1.08;background:linear-gradient(135deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;animation:drop .6s var(--spring) .06s both}
.sub{margin:10px auto 0;max-width:560px;font-size:15px;color:var(--muted);animation:drop .6s var(--spring) .12s both}
.holi-pill{display:inline-flex;align-items:center;gap:8px;margin:16px 0 0;padding:9px 20px;border-radius:30px;font-weight:700;font-size:14px;border:1px solid var(--a);background:linear-gradient(100deg,color-mix(in srgb,var(--a) 26%,transparent),color-mix(in srgb,var(--b) 18%,transparent));animation:rise .6s var(--spring) .2s both}
.holi-pill:empty{display:none}
.sbar{position:relative;width:min(560px,100%);margin:20px auto 0;animation:drop .6s var(--spring) .18s both}
.search{width:100%;padding:15px 22px 15px 48px;border-radius:40px;background:var(--panel);border:1px solid var(--bd);color:var(--text);font-size:15px;outline:0;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:.3s var(--spring)}
.search::placeholder{color:var(--muted)}
.search:focus{border-color:var(--a);box-shadow:0 0 0 4px color-mix(in srgb,var(--a) 25%,transparent);transform:scale(1.015)}
.sbar .si{position:absolute;left:19px;top:50%;translate:0 -50%;font-size:17px;opacity:.7;pointer-events:none}
.sbar kbd{position:absolute;right:16px;top:50%;translate:0 -50%;pointer-events:none}
@media(max-width:560px){.sbar kbd{display:none}}
.sres{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:20;padding:8px;border-radius:22px;background:var(--panel2);backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%);border:1px solid var(--bd);box-shadow:0 24px 60px rgba(0,0,0,.55);text-align:left;max-height:340px;overflow:auto;animation:popIn .25s var(--spring) both}

.tt .pv{height:42px;border-radius:10px;display:flex;align-items:center;padding:0 10px;font-size:22px;margin-bottom:4px}
.tt b{font-size:13px}

.tt .now{position:absolute;top:12px;left:12px;font-size:8.5px;font-weight:800;letter-spacing:.08em;padding:2px 6px;border-radius:7px;background:rgba(0,0,0,.55);color:#fff}

/* ---------- settings ---------- */
.grpset{margin-bottom:16px;padding:20px;border-radius:24px;background:var(--panel);border:1px solid var(--bd);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);animation:rise .5s var(--spring) both;animation-delay:calc(var(--i,0)*50ms)}
.grpset h4{font-size:16px;margin-bottom:4px}
.grpset>p{font-size:13px;color:var(--muted);margin-bottom:14px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid rgba(255,255,255,.07)}
.setrow:first-of-type{border-top:0}
.setrow>span{font-size:14px;font-weight:600}
.setrow small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:2px;max-width:46ch}
.tg{position:relative;flex:none;width:46px;height:26px;border-radius:20px;background:rgba(255,255,255,.14);transition:background .25s}
.tg i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .3s var(--spring)}
.tg.on{background:linear-gradient(135deg,var(--a),var(--b))}
.tg.on i{transform:translateX(20px)}
.field{width:min(260px,100%);padding:11px 16px;border-radius:14px;background:rgba(0,0,0,.3);border:1px solid var(--bd);outline:0;transition:.25s}
.field:focus{border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 22%,transparent)}
@media(max-width:620px){.setrow{flex-wrap:wrap}}

/* ---------- modals ---------- */
.modal-bg{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(6,7,16,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.modal-bg.show{display:flex;animation:fade .25s ease}
.modal-bg.closing{opacity:0;transition:opacity .2s}
.modal{position:relative;width:100%;max-width:640px;max-height:calc(100vh - 24px);overflow-x:hidden;overflow-y:auto;padding:22px 22px 16px;border-radius:26px;background:rgba(17,18,30,.94);border:1px solid var(--bd);box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 50px color-mix(in srgb,var(--a) 12%,transparent),inset 0 1px 0 rgba(255,255,255,.12);animation:rise .4s var(--spring)}
.modal::before{content:"";position:absolute;top:-120px;left:50%;width:420px;height:240px;margin-left:-210px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--a) 30%,transparent),transparent);pointer-events:none}
.m-x{position:absolute;top:16px;right:16px;z-index:2;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.08);font-size:15px;transition:background .15s}
.m-x:hover{background:rgba(255,255,255,.16)}
.mode-top{position:relative;text-align:center}
.mode-top .mi{width:50px;height:50px;margin:0 auto 10px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:25px;background:linear-gradient(135deg,color-mix(in srgb,var(--a) 35%,transparent),color-mix(in srgb,var(--b) 22%,transparent));border:1px solid var(--bd)}
.mode-top h2{font-size:21px;letter-spacing:-.01em}
.mode-top p{margin-top:6px;font-size:13.5px;color:var(--muted)}
.mode-grid{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px;padding-top:6px;transition:opacity .25s,filter .25s}
.mode-card{position:relative;display:flex;flex-direction:column;gap:10px;text-align:left;height:100%;padding:12px 12px 16px;border-radius:20px;background:rgba(255,255,255,.035);border:1px solid var(--bd);transition:transform .3s var(--spring),border-color .2s,background .2s,box-shadow .3s}
.mode-card:hover,.mode-card:focus-visible{outline:none;transform:translateY(-5px);background:rgba(255,255,255,.06);border-color:var(--a);box-shadow:0 18px 40px color-mix(in srgb,var(--a) 28%,transparent)}
.mode-card.rec{border-color:color-mix(in srgb,var(--a) 60%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--a) 16%,transparent),color-mix(in srgb,var(--a) 4%,transparent))}
.mode-tag{position:absolute;top:-10px;right:14px;z-index:3;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:4px 11px;border-radius:20px;color:#fff;background:linear-gradient(135deg,var(--a),var(--c));box-shadow:0 6px 16px color-mix(in srgb,var(--a) 45%,transparent)}
.pv2{position:relative;height:96px;border-radius:12px;overflow:hidden;background:#0a0b14;border:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column}
.pv-tabs{display:flex;gap:3px;padding:6px 6px 0;background:#15162a}
.pv-tabs span{font-size:8px;font-weight:600;color:#7d80a8;padding:4px 9px;border-radius:6px 6px 0 0;background:rgba(255,255,255,.05);white-space:nowrap}
.pv-tabs span.on{color:#fff;background:#0a0b14}
.pv-bar{display:flex;align-items:center;gap:4px;padding:6px 8px;background:#15162a}
.pv-tabs+.pv-bar{background:#0a0b14;border-bottom:1px solid rgba(255,255,255,.06)}
.pv-bar i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.22)}
.pv-bar i:nth-child(1){background:#ff5f57}.pv-bar i:nth-child(2){background:#febc2e}.pv-bar i:nth-child(3){background:#28c840}
.pv-bar em{flex:1;height:9px;margin-left:6px;border-radius:6px;background:rgba(255,255,255,.08)}
.pv-body{flex:1;position:relative;padding:8px;display:flex;gap:6px}
.pv-body .sb{width:26%;border-radius:6px;background:color-mix(in srgb,var(--a) 40%,transparent)}
.pv-body .ct{flex:1;display:flex;flex-direction:column;gap:5px;justify-content:center}
.pv-body .ct s{display:block;height:11px;border-radius:6px;background:rgba(255,255,255,.1);text-decoration:none}
.pv-body .ct s:nth-child(2){width:72%;margin-left:auto;background:color-mix(in srgb,var(--a) 60%,transparent)}
.pv-body .ct s:nth-child(3){width:55%}
.mode-card h3{font-size:16.5px;font-weight:700;padding:0 4px}
.mode-card p{font-size:13px;line-height:1.5;color:var(--muted);padding:0 4px;margin-top:-6px}
.mode-pts{display:flex;flex-wrap:wrap;gap:6px;padding:0 4px;margin-top:auto}
.mode-pts span{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.07);color:#c9cbee;white-space:nowrap}
.mode-pts span.g{background:rgba(76,214,160,.14);color:#6fe8bb}
.mode-pts span.a{background:color-mix(in srgb,var(--a) 22%,transparent);color:#fff}
.mode-note{display:flex;align-items:flex-start;gap:10px;margin:2px 4px 0;padding:10px 12px;border-radius:12px;font-size:12.5px;line-height:1.45;color:#c9cbee;background:color-mix(in srgb,var(--a) 11%,transparent);border:1px solid color-mix(in srgb,var(--a) 30%,transparent)}
.mode-note b{color:var(--text)}
.mn-ic{flex:none;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;background:color-mix(in srgb,var(--a) 25%,transparent)}
.mode-status{display:none;align-items:center;justify-content:center;gap:12px;margin-top:18px;padding:13px 16px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--bd);font-size:14px;font-weight:600}
.modal.busy .mode-status{display:flex;animation:fade .25s ease}
.modal.busy .mode-grid{opacity:.3;filter:blur(1px);pointer-events:none}
.spinr{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.2);border-top-color:var(--a);animation:spin .75s linear infinite;flex:none}
.mode-status.err .spinr{display:none}
.mode-status.err{color:#ff8da0;border-color:rgba(255,93,115,.4);background:rgba(255,93,115,.08)}
.mode-status button{background:linear-gradient(135deg,var(--a),var(--c));padding:6px 14px;border-radius:9px;font-weight:700;font-size:12.5px}
.mode-foot{margin-top:12px;text-align:center;font-size:12px;color:var(--muted)}
@media(max-height:640px){.pv2,.mode-top .mi,.mode-foot{display:none}.mode-card p{display:none}}
@media(max-width:560px){.mode-grid{grid-template-columns:1fr;gap:18px}.pv2{height:88px}.mode-pts{flex-wrap:wrap}}

/* ---------- viewer (hubs / games / proxies) ---------- */
#viewer{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;background:#07080f;opacity:0;transform:scale(1.02);pointer-events:none;transition:opacity .22s ease,transform .3s var(--spring)}
#viewer.show{opacity:1;transform:none;pointer-events:auto}
.vbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(17,18,30,.96);border-bottom:1px solid var(--bd);flex:none}
.vbar .vt{flex:1;min-width:0;display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px}
.vbar .vt i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);flex:none}
.vbar .vt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vb{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:11px;background:rgba(255,255,255,.08);font-size:13px;font-weight:600;white-space:nowrap;transition:background .15s}
.vb:hover{background:rgba(255,255,255,.16)}
.vb.cl{background:linear-gradient(135deg,var(--a),var(--c))}
#viewer iframe{flex:1;width:100%;border:0;background:#fff}
#viewer.bare .vbar{display:none}
#viewer .vexit{display:none;position:absolute;top:10px;right:10px;z-index:4;padding:7px 12px;border-radius:10px;background:rgba(0,0,0,.65);font-size:12px;font-weight:700}
#viewer.bare .vexit{display:block}
.vload{position:absolute;left:0;right:0;top:50px;bottom:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#07080f;color:var(--muted);font-weight:600;transition:opacity .2s;pointer-events:none}
#viewer.loaded .vload{opacity:0}
.vload .spinr{width:34px;height:34px}
@media(max-width:560px){.vb span{display:none}}

/* main hub full-screen iframe */
#appFrame{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:2000;background:#0b0c1a;display:block;opacity:0;transform:scale(1.03);transition:opacity .4s ease,transform .45s cubic-bezier(.22,1,.36,1)}
#appFrame.show{opacity:1;transform:none}
html.app-launching .shell,html.app-launching .bgfx,html.app-launching .bgx,html.app-launching #fx,html.app-launching #deco,html.app-launching .modal-bg{transition:opacity .4s ease,transform .4s cubic-bezier(.22,1,.36,1),filter .4s ease!important;opacity:0!important;transform:scale(.97);filter:blur(6px);pointer-events:none}
html.app-open .shell,html.app-open .bgfx,html.app-open .bgx,html.app-open #fx,html.app-open #deco,html.app-open .modal-bg,html.app-open .toasts,html.app-open .pop,html.app-open .flash{display:none!important}
html.app-open,html.app-open body{overflow:hidden;background:#0b0c1a}

/* ---------- footer ---------- */
.foot{margin-top:auto;padding-top:44px;display:flex;flex-direction:column;align-items:center;gap:14px;font-size:13px;color:var(--muted);text-align:center}
.foot-card{display:flex;align-items:center;gap:14px;text-align:left;padding:12px 22px 12px 14px;border-radius:20px;background:var(--panel);border:1px solid var(--bd);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.14)}
.foot-card .fc-i{width:42px;height:42px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center}
.foot-card img{width:100%;height:100%;object-fit:cover}
.foot-card b{display:block;font-size:15px;color:var(--text);margin-bottom:2px}
.foot strong{color:var(--text)}
.tqq{display:flex;align-items:center;gap:14px;padding:10px 18px 10px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--bd);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);text-align:left;transition:border-color .25s,transform .25s var(--spring)}
.tqq:hover{border-color:var(--a);transform:translateY(-2px)}
.tqq-badge{padding:9px 14px;border-radius:999px;font-weight:800;font-size:13px;letter-spacing:.08em;color:#fff;background:linear-gradient(135deg,var(--a),var(--b))}
.tqq-txt small{display:block;font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:1px}

.tqq-sis{display:flex;margin-left:4px}
.tqq-sis i{width:18px;height:18px;border-radius:50%;background:var(--c);border:2px solid #17121f;margin-left:-6px;box-shadow:0 0 10px color-mix(in srgb,var(--c) 55%,transparent);transition:transform .3s var(--spring)}
.tqq-sis i:first-child{margin-left:0}
.tqq:hover .tqq-sis i{transform:translateY(-4px)}
@media(max-width:480px){.tqq{border-radius:22px;flex-wrap:wrap;justify-content:center;padding:12px 16px}.tqq-sis{margin:0}}

/* ---------- trouble prompt ---------- */
.trouble{position:fixed;left:50%;bottom:22px;z-index:450;display:flex;align-items:center;gap:14px;width:min(560px,calc(100vw - 28px));padding:14px 16px;border-radius:20px;background:var(--panel2);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border:1px solid var(--a);box-shadow:0 20px 60px rgba(0,0,0,.55),0 0 40px color-mix(in srgb,var(--a) 22%,transparent);transform:translate(-50%,30px);opacity:0;transition:transform .5s var(--spring),opacity .35s}
.trouble.in{transform:translate(-50%,0);opacity:1}
.trouble .te{font-size:28px;flex:none}
.trouble .tx{flex:1;min-width:0}
.trouble .tx b{display:block;font-size:14.5px}
.trouble .tx small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.trouble .btn{flex:none}
.tclose{flex:none;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.08);font-size:13px}

/* ---------- toasts / misc ---------- */
.toasts{position:fixed;top:84px;right:20px;z-index:500;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;max-width:340px;background:rgba(15,16,32,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--bd);border-radius:14px;padding:12px 18px;font-size:14px;box-shadow:0 12px 36px rgba(0,0,0,.45);animation:tin .4s var(--spring),tout .3s ease 2.8s forwards}
.toast i{width:8px;height:8px;border-radius:50%;flex:none}
.toast.ok i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.toast.err i{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.toast.load i{background:var(--a);box-shadow:0 0 8px var(--a);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
@keyframes tin{from{opacity:0;transform:translateX(40px)}}
@keyframes tout{to{opacity:0;transform:translateX(40px)}}
@media(max-width:620px){.toasts{left:14px;right:14px;top:76px}.toast{max-width:none}}
.totop{position:fixed;right:18px;bottom:18px;z-index:40;width:44px;height:44px;border-radius:50%;background:var(--panel2);border:1px solid var(--bd);backdrop-filter:blur(14px);font-size:18px;opacity:0;pointer-events:none;transform:translateY(12px);transition:.3s var(--spring)}
.totop.on{opacity:1;pointer-events:auto;transform:none}
.totop:hover{border-color:var(--a)}
/* ---------- polish pass ---------- */
@keyframes gshift{to{background-position:200% 0}}
@keyframes shine{0%,55%{translate:-130% 0}100%{translate:130% 0}}
.grid>.a-card{flex:0 0 100%;max-width:none}

.feat .fa{min-width:210px;align-items:center;text-align:center}

::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--a),var(--b));border-radius:10px;border:3px solid transparent;background-clip:padding-box;min-height:40px}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,var(--b),var(--a));background-clip:padding-box;border:2px solid transparent}
::-webkit-scrollbar-corner{background:transparent}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--a) 70%,transparent) transparent}}
html::-webkit-scrollbar-track{background:rgba(0,0,0,.25)}
.segc::-webkit-scrollbar{height:6px}
.feat{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:30px;padding:34px 36px;border-radius:34px;background:linear-gradient(110deg,color-mix(in srgb,var(--a) 26%,transparent),color-mix(in srgb,var(--b) 12%,transparent) 70%),var(--panel)}
.feat .fi{width:132px;height:132px;padding:5px;border-radius:50%;background:conic-gradient(from var(--vipA),var(--a),var(--b),var(--c),var(--a));animation:vipSpin 7s linear infinite;box-shadow:0 18px 50px rgba(0,0,0,.5),0 0 60px color-mix(in srgb,var(--a) 50%,transparent)}
.feat .fi img{border-radius:50%;border:4px solid var(--g1)}
.feat:hover .fi{transform:scale(1.05) rotate(-3deg)}
.feat .tagline{display:inline-flex;align-items:center;gap:7px;margin-bottom:10px;padding:5px 12px 5px 10px}
.feat .tagline i{width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.3);animation:pulse 1.6s ease-in-out infinite}
.feat h3{font-size:clamp(26px,4.6vw,36px);letter-spacing:-.025em;line-height:1.1}
.feat p{margin-top:8px;font-size:15px;max-width:58ch}
.chips{margin-top:16px;gap:8px}
.chips span{padding:7px 13px;border-radius:12px;font-size:12.5px}
.feat .fa{min-width:0;align-items:center;gap:12px}
.launch{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-width:268px;padding:14px 20px 14px 14px;border-radius:22px;text-align:left;color:#fff;overflow:hidden;
  background:linear-gradient(135deg,var(--a),var(--b));
  box-shadow:0 16px 40px color-mix(in srgb,var(--a) 55%,transparent),0 0 0 1px rgba(255,255,255,.18),inset 0 1.5px 0 rgba(255,255,255,.45),inset 0 -3px 0 rgba(0,0,0,.18);
  transition:transform .3s var(--spring),box-shadow .3s,filter .2s}
.launch::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 36%,rgba(255,255,255,.42) 50%,transparent 64%);translate:-130% 0;animation:shine 3.6s ease-in-out infinite}
.launch::after{content:"";position:absolute;inset:-2px;border-radius:inherit;pointer-events:none;box-shadow:0 0 0 0 color-mix(in srgb,var(--a) 60%,transparent);animation:lring 2.4s ease-out infinite}
@keyframes lring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--a) 55%,transparent)}70%,100%{box-shadow:0 0 0 16px transparent}}
.l-ic{flex:none;width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:25px;background:rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 14px rgba(0,0,0,.18);transition:transform .35s var(--spring)}
.l-tx{flex:1;min-width:0}
.l-tx b{display:block;font-size:18px;font-weight:800;letter-spacing:-.015em;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.l-tx small{display:block;margin-top:2px;font-size:12px;font-weight:600;opacity:.88}
.l-ar{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:800;background:rgba(0,0,0,.2);transition:transform .35s var(--spring),background .2s}
.launch:hover,.launch:focus-visible{outline:none;transform:translateY(-4px) scale(1.025);filter:brightness(1.08);box-shadow:0 22px 52px color-mix(in srgb,var(--a) 65%,transparent),0 0 0 1px rgba(255,255,255,.3),inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(0,0,0,.18)}
.launch:hover .l-ic{transform:rotate(-12deg) scale(1.1)}
.launch:hover .l-ar{transform:translateX(4px);background:rgba(0,0,0,.3)}
.launch:active{transform:scale(.97);transition-duration:.08s}
.fa-note{font-size:12px;font-weight:600;color:var(--muted)}
@media(max-width:900px){.feat{grid-template-columns:auto minmax(0,1fr);padding:26px}.feat .fa{grid-column:1/-1}.launch{min-width:0}}
@media(max-width:620px){.feat{grid-template-columns:1fr;justify-items:center;text-align:center}.feat .fi{width:112px;height:112px}.feat p{margin-inline:auto}.chips{justify-content:center}}

/* ---------- main site card: back to the classic layout ---------- */
.feat{display:flex;align-items:center;gap:24px;padding:26px 28px;border-radius:28px}
.feat .fi{width:100px;height:100px;padding:0;background:linear-gradient(135deg,var(--a),var(--b));animation:none;box-shadow:0 14px 40px rgba(0,0,0,.45),0 0 36px color-mix(in srgb,var(--a) 45%,transparent)}
.feat .fi img{border:0;border-radius:0}
.feat:hover .fi{transform:scale(1.06) rotate(-4deg)}
.feat .tagline{padding:4px 11px;margin-bottom:8px}
.feat .tagline i{display:none}
.feat h3{font-size:clamp(22px,4vw,28px)}
.feat p{font-size:14px;margin-top:6px}
.chips{margin-top:12px;gap:7px}
.chips span{padding:5px 11px;border-radius:20px;font-size:12px}
.feat .fa{flex:none;display:flex;flex-direction:column;gap:10px;align-items:stretch;min-width:190px;text-align:center}
.feat .btn.pri{padding:14px 22px;font-size:15px;border-radius:14px}
.feat .fnote{text-align:center}
@media(max-width:760px){.feat{flex-direction:column;text-align:center;padding:22px}.feat .fa{width:100%}.chips{justify-content:center}.feat p{margin-inline:auto}}

/* ---------- smoother transitions ---------- */
.stage{min-height:60vh}
.card,.tile,.feat,.a-card,.pass,.grpset,.opt,.nav,.tt,.sbar,.sub,.holi-pill{animation-fill-mode:backwards!important}
.modal-bg.closing .modal{transform:scale(.96) translateY(8px);opacity:0;transition:transform .22s cubic-bezier(.22,1,.36,1),opacity .2s}
.modal-bg.show{animation:fade .28s ease}
.modal{animation:rise .45s cubic-bezier(.22,1,.36,1)}
.pop{animation-duration:.4s}
.sres{animation-duration:.3s}
.toast{animation:tin .45s cubic-bezier(.22,1,.36,1),tout .3s ease 2.8s forwards}
.trouble{transition:transform .55s cubic-bezier(.22,1,.36,1),opacity .35s}
#viewer{will-change:opacity,transform}
@keyframes svin{from{opacity:0;transform:translate3d(var(--dx,0),18px,0) scale(.985)}}
@keyframes svout{to{opacity:0;transform:translate3d(var(--dx,0),-8px,0) scale(.99)}}

/* ---------- tab + general transition polish ---------- */
.stage{position:relative}
.sv.on{animation:svin .5s var(--spring) backwards}
@keyframes svin{from{opacity:0;transform:translate3d(var(--dx,0),0,0) scale(.992)}}
@keyframes svout{to{opacity:0;transform:translate3d(var(--dx,0),0,0) scale(.99)}}
.sv:not(#s-home).on>.ph{animation:rise .55s var(--spring) backwards}
.sv:not(#s-home).on>.ctrl,.sv:not(#s-home).on>.empty2,.sv:not(#s-home).on>.pxwrap{animation:rise .55s var(--spring) .07s backwards}
.foot{transition:opacity .3s ease}
.shell.swap .foot{opacity:0}
.tabs button span{display:inline-block}
.tabs button.on span{animation:tabpop .55s var(--spring)}
@keyframes tabpop{35%{transform:scale(1.28) rotate(-8deg)}}
.tabs button{transition:color .25s,transform .2s var(--spring)}
.tabs button:active{transform:scale(.94)}
.ind{transition:transform .55s var(--spring),width .55s var(--spring)}
.card:hover,.card:focus-visible{transform:translateY(-4px) scale(1.012)}
.sres .row,.mini,.tt,.segc button,.btn,.tbtn,.heart,.ext,.vb{transition-timing-function:cubic-bezier(.22,1,.36,1)}
.search{transition:border-color .3s,box-shadow .3s,transform .4s var(--spring)}
a,button,.card,.a-card,.g-card{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid color-mix(in srgb,var(--a) 80%,#fff);outline-offset:2px}
.card:focus-visible,.a-card:focus-visible{outline-offset:3px}
/* ---------- scroll reveal + home-only footer ---------- */
[data-rv]{animation:none!important;transition:opacity .75s var(--spring) var(--rd,0ms),transform .9s var(--spring) var(--rd,0ms),filter .65s ease var(--rd,0ms),border-color .3s,box-shadow .3s}
:where([data-rv]:not(.in)){opacity:0;transform:translateY(34px) scale(.96);filter:blur(8px)}
[data-rv].done{transition:transform .3s var(--spring),border-color .3s,box-shadow .3s,opacity .3s,filter .3s}
.foot{margin-top:0;padding:70px 0 10px;gap:16px}
.foot-card,.tqq{transition:transform .35s var(--spring),border-color .25s,box-shadow .3s}
.foot-card:hover{transform:translateY(-3px);border-color:var(--a);box-shadow:0 14px 34px color-mix(in srgb,var(--a) 22%,transparent)}
.foot-keys{opacity:.8}
.shell{padding-bottom:36px}
/* ---------- library grid fix + filter transitions ---------- */
.sbar .si,.sbar kbd{z-index:3}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;justify-content:stretch}
.grid>.card{flex:none;max-width:none;width:100%}
.grid>.grp-h,.grid>.credit,.grid>.g-card,.grid>.a-card,.grid>.empty2{grid-column:1/-1;flex:none}
#libGrid{will-change:opacity,transform}
#libGrid.swapout{opacity:0;transform:translateY(10px) scale(.992);transition:opacity .15s ease,transform .15s ease!important}
#libGrid:not(.swapout){transition:opacity .3s ease,transform .4s var(--spring)}
.grid.quiet>.card,.grid.quiet>.grp-h{animation:none}
.segc button{transition:color .25s,transform .2s var(--spring)}
.segc button:active{transform:scale(.94)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}html{scroll-behavior:auto}}
</style>
</head>

/* ===================== HOLIDAYS =====================
   Each returns {s:start, e:end(inclusive), p:peak day}. The auto theme uses whichever holiday you are inside
   (the peak day always wins, otherwise the shortest window). Movable holidays are worked out for any year. */
const D=(y,m,d)=>new Date(y,m,d);
const addD=(d,n)=>D(d.getFullYear(),d.getMonth(),d.getDate()+n);
const nthDow=(y,m,dow,n)=>D(y,m,1+((dow-D(y,m,1).getDay()+7)%7)+(n-1)*7);

function calFind(cal,test,y,from,days){

    for(let i=0;i<days;i++){const dt=D(y,0,from+i),p={};F.formatToParts(dt).forEach(x=>p[x.type]=x.value);if(test(p)){out=dt;break}}

const HOL={

const dayOf=x=>D(x.getFullYear(),x.getMonth(),x.getDate());
function instances(y){
  const out=[];
  Object.keys(HOL).forEach(k=>{
    let r;try{r=HOL[k](y)}catch(_){r=null}
    (Array.isArray(r)?r:[r]).forEach(v=>{if(v)out.push({k,s:dayOf(v.s),e:dayOf(v.e),p:dayOf(v.p)})});
  });
  return out;

const span=h=>h.e-h.s;
function autoTheme(d=now()){
  d=dayOf(d);const y=d.getFullYear(),all=[...instances(y-1),...instances(y),...instances(y+1)];
  const inside=all.filter(h=>d>=h.s&&d<=h.e);
  if(!inside.length)return 'default';
  const peak=inside.filter(h=>+h.p===+d).sort((a,b)=>span(a)-span(b));
  return(peak[0]||inside.sort((a,b)=>span(a)-span(b))[0]).k;
}
function nextHoliday(d=now()){
  d=dayOf(d);const y=d.getFullYear();let best=null;
  [...instances(y),...instances(y+1)].forEach(h=>{const n=Math.round((h.p-d)/864e5);if(n>=0&&(!best||n<best.days))best={k:h.k,days:n,p:h.p}});
  return best;
}
/* the current / next occurrence of a holiday, for the date labels in the picker */
function nearest(k,d=now()){
  d=dayOf(d);const y=d.getFullYear();
  const l=[...instances(y-1),...instances(y),...instances(y+1)].filter(h=>h.k===k&&h.e>=d).sort((a,b)=>a.s-b.s);

const fm=(d,o)=>d.toLocaleDateString([],o);
function rangeLabel(k){
  const h=nearest(k);if(!h)return'';
  if(+h.s===+h.e)return fm(h.s,{month:'short',day:'numeric'});
  const same=h.s.getMonth()===h.e.getMonth();
  return fm(h.s,{month:'short',day:'numeric'})+' – '+(same?h.e.getDate():fm(h.e,{month:'short',day:'numeric'}));
}

const FX={cv:$('#fx'),ctx:null,W:0,H:0,dpr:1,P:[],S:[],R:[],cfg:null,raf:0,last:0,next:0,spr:{}};
FX.ctx=FX.cv.getContext('2d');

function sprite(em){

}
function fxResize(){
  FX.dpr=Math.min(devicePixelRatio||1,1.5);

  FX.cv.width=FX.W*FX.dpr;FX.cv.height=FX.H*FX.dpr;
}
const rnd=(a,b)=>a+Math.random()*(b-a);
function fxCount(){
  const base=FX.cfg.n||20,area=Math.min(1,FX.W*FX.H/(1280*720)),lv=fxLevel()==='light'?.5:1;
  return Math.max(6,Math.round(base*Math.max(.45,area)*lv));

function spawn(p,init){
  const c=FX.cfg,s=rnd(c.sz?c.sz[0]:14,c.sz?c.sz[1]:26);
  p.spr=sprite(c.e[(Math.random()*c.e.length)|0]);p.s=s;p.ph=rnd(0,6.28);p.rot=rnd(-.5,.5);p.vr=rnd(-.6,.6);p.al=rnd(.55,.95);
  const sp=c.sp||1;
  if(c.k==='fall'){p.x=rnd(0,FX.W);p.y=init?rnd(-20,FX.H):-40;p.vy=rnd(28,70)*sp;p.vx=rnd(-10,10)}
  else if(c.k==='rise'){p.x=rnd(0,FX.W);p.y=init?rnd(0,FX.H):FX.H+40;p.vy=-rnd(24,60)*sp;p.vx=rnd(-8,8)}
  else if(c.k==='drift'){p.x=init?rnd(-50,FX.W):-80;p.y=rnd(30,FX.H*.75);p.vx=rnd(14,40)*sp;p.vy=0;p.al=rnd(.3,.6)}
  else{p.x=rnd(0,FX.W);p.y=rnd(0,FX.H);p.vx=rnd(-6,6);p.vy=rnd(-6,6);p.tw=rnd(.6,1.6)}
}
function launchRocket(){
  const c=FX.cfg,x=rnd(FX.W*.12,FX.W*.88);
  FX.R.push({x,y:FX.H+10,ty:rnd(FX.H*.12,FX.H*.5),vy:-rnd(380,520),col:c.col[(Math.random()*c.col.length)|0]});
}
function explode(r){
  const n=Math.round((fxLevel()==='light'?34:60)*rnd(.8,1.2)),col=r.col,two=Math.random()<.3?FX.cfg.col[(Math.random()*FX.cfg.col.length)|0]:col;
  for(let i=0;i<n;i++){
    const a=Math.PI*2*i/n+rnd(-.05,.05),sp=rnd(60,210)*(Math.random()<.25?.5:1);
    FX.S.push({x:r.x,y:r.y,px:r.x,py:r.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,dec:rnd(.5,.85),col:i%3===0?two:col});
  }

function fxFrame(t){
  FX.raf=requestAnimationFrame(fxFrame);
  if(document.hidden||!FX.cfg)return;
  const dt=Math.min((t-FX.last)/1000||0,.05);FX.last=t;
  const ctx=FX.ctx,W=FX.W,H=FX.H;
  ctx.setTransform(FX.dpr,0,0,FX.dpr,0,0);ctx.clearRect(0,0,W,H);
  const c=FX.cfg;
  if(c.k==='fire'){
    FX.next-=dt;
    if(FX.next<=0&&FX.R.length<3){launchRocket();FX.next=rnd(.7,1.7)}
    ctx.globalCompositeOperation='lighter';
    for(let i=FX.R.length-1;i>=0;i--){
      const r=FX.R[i];r.y+=r.vy*dt;r.vy*=.992;
      ctx.fillStyle=r.col;ctx.globalAlpha=.9;ctx.fillRect(r.x-1.5,r.y,3,12);
      if(r.y<=r.ty||r.vy>-90){explode(r);FX.R.splice(i,1)}
    }
    ctx.lineWidth=2;ctx.lineCap='round';
    for(let i=FX.S.length-1;i>=0;i--){
      const s=FX.S[i];s.px=s.x;s.py=s.y;s.vy+=70*dt;s.vx*=.985;s.vy*=.985;s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=s.dec*dt;
      if(s.life<=0){FX.S.splice(i,1);continue}
      ctx.globalAlpha=Math.max(0,s.life);ctx.strokeStyle=s.col;ctx.beginPath();ctx.moveTo(s.px,s.py);ctx.lineTo(s.x,s.y);ctx.stroke();
    }

  }
  for(let i=0;i<FX.P.length;i++){
    const p=FX.P[i];p.ph+=dt;
    if(c.k==='fall'){p.y+=p.vy*dt;p.x+=(p.vx+Math.sin(p.ph*1.3)*22)*dt;if(p.y>H+40)spawn(p)}
    else if(c.k==='rise'){p.y+=p.vy*dt;p.x+=(p.vx+Math.sin(p.ph*1.5)*16)*dt;if(p.y<-40)spawn(p)}
    else if(c.k==='drift'){p.x+=p.vx*dt;p.y+=Math.sin(p.ph*.6)*6*dt;if(p.x>W+80)spawn(p)}
    else if(c.k==='float'||c.k==='fire'){p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.x<-30)p.x=W+30;if(p.x>W+30)p.x=-30;if(p.y<-30)p.y=H+30;if(p.y>H+30)p.y=-30}
    p.rot+=p.vr*dt*(c.k==='float'?.3:1);

  }

}
function fxSet(cfg){
  FX.cfg=null;FX.P=[];FX.S=[];FX.R=[];FX.next=.3;

  if(!cfg||fxLevel()==='off')return;
  FX.cfg=cfg;fxResize();
  const n=cfg.k==='fire'?Math.round(fxCount()*.6):fxCount();
  for(let i=0;i<n;i++){const p={};spawn(p,true);FX.P.push(p)}

}

/* ===================== LAUNCHING ===================== */
async function fetchText(url){
  let last;
  for(let i=0;i<3;i++){
    const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),20000);
    try{
      const r=await fetch(url+(url.includes('?')?'&':'?')+'v='+Date.now()+i,{cache:'no-store',signal:ctl.signal});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const t=await r.text();clearTimeout(to);
      if(t.trim().length<80)throw new Error('Empty file');
      return t;
    }catch(e){clearTimeout(to);last=e;if(i<2)await new Promise(res=>setTimeout(res,500*(i+1)))}
  }
  throw last;
}

function launch(h,mode){
  if(!h)return;
  if(h.main){launchBlank();return}
  if(!h.url){toast(h.name+' has no link yet.','err');return}
  pushRecent(h);

}
const SPLASH=n=>'<!DOCTYPE html><title>Loading…</title><body style="margin:0;height:100vh;display:grid;place-items:center;background:#0b0c1a;color:#9a9dc4;font:600 16px system-ui,sans-serif">Loading '+esc(n)+'…</body>';

function openTab(h){
  if(!isRaw(h.url)){window.open(h.url,'_blank','noopener');return}
  const win=window.open('about:blank','_blank');
  if(!win){toast('Popup blocked — allow popups for this site','err');return}
  try{win.document.open();win.document.write(SPLASH(h.name));win.document.close()}catch(_){}
  const t=toast('Loading '+h.name+'...','load');
  fetchText(h.url).then(text=>{t.remove();if(win.closed)return;win.document.open();win.document.write(text);win.document.close()})
    .catch(()=>{t.remove();try{win.close()}catch(_){}toast('Failed to load '+h.name,'err')});
}
/* about:blank launch: Quizlet sits in the tab permanently, and after a delay the app fades in on top of it */
const QSHELL='<!DOCTYPE html><title>Quizlet</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;height:100%;background:#fff;overflow:hidden}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}#behind{z-index:1;background:#fff}#app{z-index:2;opacity:0;background:#0b0c1a;transition:opacity .35s ease;will-change:opacity}#app.in{opacity:1}</style><body><iframe id="behind" src="'+BLANK_BEHIND+'"></iframe></body>';
async function blankShell(name,getContent,delay,onOpen){
  const win=window.open('about:blank','_blank');           // must happen straight from the click
  if(!win){toast('Popup blocked — allow popups for this site','err');return null}
  try{win.document.open();win.document.write(QSHELL);win.document.close()}catch(_){}
  if(onOpen)onOpen();
  const content=getContent();content.catch(()=>{});          // starts downloading right away, while the delay runs
  await new Promise(r=>setTimeout(r,delay));
  try{
    const c=await content;
    if(win.closed)return win;
    const f=win.document.createElement('iframe');f.id='app';f.title=name;
    f.setAttribute('allow','fullscreen; clipboard-read; clipboard-write; autoplay; microphone; camera; geolocation; encrypted-media; picture-in-picture');f.setAttribute('allowfullscreen','');
    let shown=false;const show=()=>{if(shown)return;shown=true;f.classList.add('in')};   // no rAF here: the launcher tab is in the background, so its rAF never fires
    f.addEventListener('load',show);setTimeout(show,2500);
    if(c.srcdoc!=null)f.srcdoc=c.srcdoc;else f.src=c.src;
    win.document.body.appendChild(f);void f.offsetWidth;   // commit the opacity:0 frame so the fade-in really animates
  }catch(e){try{win.close()}catch(_){}toast('Failed to load '+name,'err')}
  return win;
}
function blankApp(h){
  blankShell(h.name,()=>isRaw(h.url)?fetchText(h.url).then(x=>({srcdoc:x})):Promise.resolve({src:h.url}),APP_DELAY,()=>armTrouble(h));
}

async function fetchApp(){

function setupReveal(root){

  const io=new IntersectionObserver(list=>{
    list.forEach(en=>{

      const t=en.target;io.unobserve(t);
      requestAnimationFrame(()=>{t.classList.add('in');setTimeout(()=>t.classList.add('done'),1300)});
    });
  },{rootMargin:'0px 0px -6% 0px',threshold:.06});
  els.forEach(el=>{
    const i=Array.prototype.indexOf.call(el.parentNode.children,el);
    el.setAttribute('data-rv','');el.style.setProperty('--rd',((i%4)*80)+'ms');io.observe(el);
  });
}

    +'<div class="opt"><div class="ic">🎁</div><h3>Seasonal passes</h3><p>Level up for titles, badges and glowing name effects everyone can see.</p></div>'
    +'<div class="opt"><div class="ic">⚙️</div><h3>Settings</h3><p>Style your bubbles, set a personal background, tune blur and add pronouns.</p></div>'
  +'</section>';
  $('#s-home').insertAdjacentHTML('beforeend',FOOT);

  fillHomeDynamic();

  q.oninput=()=>searchPanel(q.value);
  q.onfocus=()=>{if(q.value.trim())searchPanel(q.value)};

}
const TZ=[['New York','America/New_York'],['London','Europe/London'],['Tokyo','Asia/Tokyo'],['Sydney','Australia/Sydney']],MN=['New Moon','Waxing Crescent','First Quarter','Waxing Gibbous','Full Moon','Waning Gibbous','Last Quarter','Waning Crescent'],ME=Array.from('🌑🌒🌓🌔🌕🌖🌗🌘'),
QT=['Small steps every day beat big plans someday.','Done is better than perfect — ship it.','Take a breath. You are doing better than you think.','Curiosity is a superpower. Follow it today.','Focus on one thing for the next 25 minutes.','Rest is productive too. Drink some water.','Make something today that you would use yourself.','Progress, not perfection.','Your future self will thank you for starting now.','Be kind to yourself and to others today.'];
const setT=(id,v)=>{const e=$('#'+id);if(e&&e.textContent!==String(v))e.textContent=v};
function fillHomeDynamic(){
  const n=now(),t=TH[curKey]||TH.default;
  const pill=$('#holiPill');if(pill)pill.textContent=t.m||'';
  const pass=$('#pass');if(pass){const mo=n.getMonth(),d=n.getDate();pass.classList.toggle('show',curKey==='halloween'&&(mo===9||(mo===10&&d<=7)))}
  const nick=store.get('nick','Guess');
  const nh=nextHoliday(n);
  if(nh&&$('#he')){const T=TH[nh.k];$('#he').textContent=T.e;$('#hn').textContent=T.n;$('#hdays').textContent=nh.days?nh.days===1?'Tomorrow!':'in '+nh.days+' days':'Today! 🎉'}
  const ht=$('#hth');if(ht){const r=resolveTheme();ht.textContent=t.e+' '+t.n+' theme'+(r.auto?' · auto':'')}
  const hf=$('#homeFav');if(hf){const f=fav().map(k=>byKey[k]).filter(Boolean).slice(0,5);hf.innerHTML=f.length?f.map(mini).join(''):'<span class="v">Tap the ♡ on any hub or game to pin it here.</span>'}
  const hr=$('#homeRec');if(hr){const f=rec().map(k=>byKey[k]).filter(Boolean).slice(0,5);hr.innerHTML=f.length?f.map(mini).join(''):'<span class="v">Things you open show up here.</span>'}
  tick();
}
window._onTheme=()=>{fillHomeDynamic();if(at==='set')refreshThemeUI()};
function tick(){
  const n=now(),h24=store.get('h24',true),sec=store.get('secs',true),y=n.getFullYear(),hr=n.getHours();
  const hc=$('#hc');if(hc){
    hc.textContent=n.toLocaleTimeString([],{hour:'numeric',minute:'2-digit',second:sec?'2-digit':undefined,hour12:!h24});
    const g=GREET(hr),nick=store.get('nick','Guess');
    $('#hd').textContent=g[0]+(nick?', '+nick:'')+' '+g[1]+' · '+n.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric',year:'numeric'});
    const d0=D(y,n.getMonth(),n.getDate()),yl=(D(y+1,0,1)-D(y,0,1))/864e5,doy=Math.round((d0-D(y,0,1))/864e5)+1,yp=(doy-1+(n-d0)/864e5)/yl*100;
    $('#yp').textContent=yp.toFixed(1)+'%';$('#yb').style.width=yp+'%';$('#yl').textContent='Day '+doy+' of '+yl;
    const m=n.getMonth(),dd=n.getDate(),dim=D(y,m+1,0).getDate(),mp=(dd-1+(n-d0)/864e5)/dim*100;
    setT('mp',mp.toFixed(0)+'%');$('#mb').style.width=mp+'%';setT('ml',(dim-dd)+' days left in '+n.toLocaleDateString([],{month:'long'}));
    const di=(n.getDay()+6)%7;$$('#wk i').forEach((e,i)=>e.className=i<di?'dn':i===di?'now':'');
    setT('we',di>=5?"It's the weekend 🎉":'Weekend in '+(5-di)+' day'+(5-di>1?'s':''));
    const t=new Date(Date.UTC(y,m,dd)),dn=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-dn);setT('wn','· Week '+Math.ceil(((t-Date.UTC(t.getUTCFullYear(),0,1))/864e5+1)/7));
    const jd=n/864e5+2440587.5,ph=(((jd-2451550.1)/29.530588853)%1+1)%1,mi=Math.round(ph*8)%8,fd=Math.round(((.5-ph+1)%1)*29.53);
    setT('me',ME[mi]);setT('mn',MN[mi]);setT('mi',Math.round((1-Math.cos(2*Math.PI*ph))/2*100)+'% illuminated');setT('mf',fd<1?'Today':fd===1?'Tomorrow':fd+' days');
    TZ.forEach((z,i)=>setT('wc'+i,n.toLocaleTimeString([],{timeZone:z[1],hour:'numeric',minute:'2-digit',hour12:!h24})));
    setT('qt',QT[doy%QT.length]);
    const pd=(n-d0)/864e5,left=864e5-(n-d0);setT('dp',Math.floor(pd*100)+'%');$('#rp').style.strokeDashoffset=100-pd*100;setT('dl',(left/36e5|0)+'h '+Math.floor(left%36e5/6e4)+'m left today');
    const nd=Math.round(((1-ph)%1)*29.53);setT('mnn',nd<1?'Today':nd===1?'Tomorrow':nd+' days');
    setT('pd',hr<5?'Late night 🌌':hr<12?'Morning 🌅':hr<17?'Afternoon ☀️':hr<21?'Evening 🌇':'Night 🌙');setT('tz',Intl.DateTimeFormat().resolvedOptions().timeZone);
    const o=-n.getTimezoneOffset();setT('off','UTC'+(o<0?'−':'+')+pad(Math.abs(o)/60|0)+':'+pad(Math.abs(o)%60));setT('iso',y+'-'+pad(m+1)+'-'+pad(dd));setT('ux',Math.floor(n/1e3));
    setT('st1',store.get('opens',0));setT('st2',fav().length);setT('st3',ALL.length+' hubs & games · '+(TH[curKey]||TH.default).e+' '+(TH[curKey]||TH.default).n+' theme');
  }
}
setInterval(tick,1000);

/* ---- search ---- */
let sSel=-1,sList=[];
function searchMatch(q){
  q=q.trim().toLowerCase();if(!q)return[];
  const sc=h=>{const n=h.name.toLowerCase();return n===q?0:n.startsWith(q)?1:n.includes(q)?2:(h.group||'').toLowerCase().includes(q)?3:(h.desc||'').toLowerCase().includes(q)?4:9};
  return ALL.map(h=>[sc(h),h]).filter(x=>x[0]<9).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
}
const TYPE={apps:'App',hubs:'Hub',links:'Link',proxies:'Proxy'};
function searchPanel(v){
  const box=$('#sres');if(!box)return;
  if(!v.trim()){box.hidden=true;return}
  sList=searchMatch(v);sSel=sList.length?0:-1;
  box.hidden=false;
  box.innerHTML=sList.length?sList.slice(0,8).map((h,i)=>'<button class="row'+(i===0?' sel':'')+'" type="button" data-k="'+esc(h.key)+'">'+ico(h)+'<div><b>'+esc(h.name)+'</b><small>'+esc((h.desc||'').slice(0,70))+'</small></div><span class="ty">'+TYPE[h.sec]+'</span></button>').join('')
    +(sList.length>8?'<div class="none">+'+(sList.length-8)+' more in <a data-go="lib" style="cursor:pointer;color:var(--a)">Games</a></div>':''):'<div class="none">Nothing found for “'+esc(v.trim())+'”</div>';
}
function searchKeys(e){
  const box=$('#sres');
  if(e.key==='Escape'){e.target.value='';box.hidden=true;e.target.blur();return}
  if(box.hidden)return;
  const rows=$$('.row',box);
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();if(!rows.length)return;
    sSel=(sSel+(e.key==='ArrowDown'?1:-1)+rows.length)%rows.length;rows.forEach((r,i)=>r.classList.toggle('sel',i===sSel));rows[sSel].scrollIntoView({block:'nearest'});
  }else if(e.key==='Enter'&&rows[sSel]){e.preventDefault();box.hidden=true;launch(byKey[rows[sSel].dataset.k])}
}
document.addEventListener('click',e=>{const box=$('#sres');if(box&&!box.hidden&&!e.target.closest('.sbar'))box.hidden=true});

/* ===================== LIBRARY ===================== */
let libSec=store.get('libSec','all'),libQ='',libSeg=null,openSeg=null;
function renderLib(){
  const cnt={all:0};ALL.filter(h=>h.sec!=='proxies').forEach(h=>{cnt[h.sec]=(cnt[h.sec]||0)+1;cnt.all++});
  $('#s-lib').innerHTML='<div class="ph"><h2>Hubs &amp; Games</h2><p>Every hub, game, app and link from the main site. All unlocked, no sign-in needed.</p></div>'
   +'<div class="sbar" style="margin:0 0 16px;width:100%;animation:none"><span class="si">🔎</span><input class="search" id="lq" placeholder="Search hubs, games and apps…  (press / )" autocomplete="off" spellcheck="false" value="'+esc(libQ)+'"></div>'
   +'<div class="ctrl"><div class="segc" id="libTabs">'+[['all','All'],...SECS].map(([k,l])=>'<button type="button" data-k="'+k+'">'+l+'<small>'+(cnt[k]||0)+'</small></button>').join('')+'</div>'
   +'</div>'
   +'<div class="grid" id="libGrid"></div>';
  libSeg=seg($('#libTabs'),k=>{libSec=k;store.set('libSec',k);swapLib()},libSec);
  $('#lq').oninput=e=>{libQ=e.target.value.trim().toLowerCase();drawLib(true)};
  drawLib();
}
/* filter change: the old grid fades, the height glides to the new size, then the new cards rise in */
let swapT=0,swapT2=0;
function swapLib(){
  const g=$('#libGrid');if(!g)return;
  clearTimeout(swapT);clearTimeout(swapT2);
  const h0=g.offsetHeight;
  g.style.transition='none';g.style.height=h0+'px';g.style.overflow='hidden';void g.offsetWidth;
  g.classList.add('swapout');
  swapT=setTimeout(()=>{
    drawLib();
    g.style.height='auto';const h1=g.scrollHeight;g.style.height=h0+'px';void g.offsetWidth;
    g.classList.remove('swapout');
    g.style.transition='height .5s cubic-bezier(.22,1,.36,1)';g.style.height=h1+'px';
    swapT2=setTimeout(()=>{g.style.height='';g.style.transition='';g.style.overflow=''},540);
  },150);
}
function drawLib(quiet){
  const g=$('#libGrid');if(!g)return;
  const q=libQ,m=h=>!q||h.name.toLowerCase().includes(q)||(h.desc||'').toLowerCase().includes(q)||(h.group||'').toLowerCase().includes(q);
  const out=[];let i=0;
  SECS.forEach(([sec,label])=>{
    if(libSec!=='all'&&libSec!==sec)return;
    const items=ALL.filter(h=>h.sec===sec&&m(h));if(!items.length)return;
    if(libSec==='all')out.push('<div class="grp-h">'+label+'<i>'+items.length+'</i></div>');
    let lastG=null;
    items.forEach(h=>{
      if(h.group&&h.group!==lastG){lastG=h.group;out.push('<div class="grp-h" style="margin-top:'+(libSec==='all'?'0':'12px')+'">'+esc(h.group)+'</div>')}
      out.push(card(h,i++));
    });
  });
  g.innerHTML=out.length?out.join(''):'<div class="empty2" style="grid-column:1/-1"><span class="em2">🔍</span>Nothing found'+(q?' for “'+esc(q)+'”':'')+'.<br>Try the Proxies tab too.</div>';
  g.classList.toggle('quiet',!!quiet);
}

/* ===================== SETTINGS ===================== */
const tgl=(id,t,s,on)=>'<div class="setrow"><span>'+t+'<small>'+s+'</small></span><button class="tg'+(on?' on':'')+'" id="'+id+'" type="button" role="switch" aria-checked="'+!!on+'"><i></i></button></div>';
function renderSet(){
  $('#s-set').innerHTML='<div class="ph"><h2>Settings</h2><p>Everything is saved in this browser.</p></div>'
  +'<div class="grpset" style="--i:0"><h4>Theme</h4><p>Pick one yourself, or leave it on Auto and it changes with the holidays.</p><div id="sg"></div></div>'
  +'<div class="grpset" style="--i:2"><h4>Effects</h4><p>Falling snow, fireworks, bats and everything else. Turn it down if the page feels laggy.</p>'
    +'<div class="setrow"><span>Animations &amp; particles<small>Full, light (fewer particles) or off.</small></span><div class="segc" id="fxTabs"><button type="button" data-k="full">Full</button><button type="button" data-k="light">Light</button><button type="button" data-k="off">Off</button></div></div></div>'
  +'<div class="grpset" style="--i:3"><h4>You</h4><p>Small touches.</p>'
    +'<div class="setrow"><span>Nickname<small>Shown in your greeting on Home.</small></span><input class="field" id="nick" maxlength="24" placeholder="What should we call you?" value="'+esc(store.get('nick','Guess'))+'"></div>'
    +tgl('ttr','Trouble helper','After an about:blank launch, show “Having trouble? Launch as iframe” when you come back.',store.get('trouble',true))
    +tgl('t24','24-hour clock','Show the time as 13:00 instead of 1:00 PM.',store.get('h24',true))
    +tgl('tsec','Show seconds','Tick the clock every second.',store.get('secs',true))
    +'<div class="setrow"><span>Reset<small>Clears favorites and recently opened.</small></span><button class="btn sec sm" id="reset" type="button">Clear</button></div></div>';
  refreshThemeUI();
  seg($('#fxTabs'),k=>{store.set('fx',k);const t=TH[curKey];fxSet(t.fx||null)},fxLevel());

  [['t24','h24'],['tsec','secs'],['ttr','trouble']].forEach(([id,key])=>$('#'+id).onclick=e=>{const b=e.currentTarget,on=!b.classList.contains('on');b.classList.toggle('on',on);b.setAttribute('aria-checked',on);store.set(key,on);tick()});
  $('#reset').onclick=()=>{store.set('fav',[]);store.set('rec',[]);badge();toast('Cleared')};

/* ===================== GLOBAL EVENTS ===================== */
$('#stage').addEventListener('click',e=>{
  if(themeClick(e))return;
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
  if(e.target.closest('#mainGo')){mainFlow();return}
  if(e.target.closest('#holTile')){e.stopPropagation();scrollTo({top:0,behavior:'smooth'});openPop();return}
  const f=e.target.closest('[data-fav]');if(f){e.stopPropagation();toggleFav(f.dataset.fav);return}
  const k=e.target.closest('[data-k]');if(k&&byKey[k.dataset.k]){const sr=$('#sres');if(sr)sr.hidden=true;launch(byKey[k.dataset.k])}
});
$('#stage').addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.card,.g-card,.a-card')){e.preventDefault();launch(byKey[e.target.dataset.k])}
});
document.addEventListener('keydown',e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||''));
  if(e.key==='Escape'){
    if(V.classList.contains('bare')){V.classList.remove('bare');return}
    if(V.classList.contains('show')){viewerClose();return}
    if($('#modeBg').classList.contains('show')&&!launching){closeModeModal();return}
    closePop();return;
  }
  if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
  if(V.classList.contains('show'))return;
  if(e.key==='/'){e.preventDefault();const q=$('#q')||$('#lq')||$('#pq');if(q){q.focus();q.select()}else{go('lib');setTimeout(()=>{const l=$('#lq');if(l)l.focus()},60)}}
  else if(e.key==='t'||e.key==='T'){popEl.hidden?openPop():closePop()}
  else if(/^[1-5]$/.test(e.key))go(ORD[+e.key-1]);
});
$('#stage').addEventListener('pointermove',e=>{const c=e.target.closest('.card,.feat,.a-card');if(!c)return;const r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px')},{passive:true});
const tt=$('#totop');addEventListener('scroll',()=>tt.classList.toggle('on',scrollY>500),{passive:true});
tt.onclick=()=>scrollTo({top:0,behavior:'smooth'});

/* ===================== BOOT ===================== */
(function boot(){
  try{if(store.get('theme',null)===null&&localStorage.getItem('ich.hwTheme')==='0')store.set('theme','default')}catch(_){}   // respect "Halloween off" from the old launcher
  applyTheme({instant:true});
  const h=(location.hash||'').slice(1);
  go(ORD.includes(h)?h:'home');
  badge();
  $$('img[data-ic]').forEach(i=>i.src=ICON);
  const fi=$('link[rel=icon]');if(fi){fi.type='image/webp';fi.href=ICON}
  /* loading screen: stays for a moment, waits for fonts, then fades away */
  const bootEl=$('#boot');
  if(bootEl){
    const t0=performance.now(),bar=$('.bbar i',bootEl),tt=TH[curKey]||TH.default;
    const msg=$('#bootMsg');if(msg)msg.textContent=tt.m||'Getting things ready…';
    requestAnimationFrame(()=>{bar.style.width='38%'});
    const fonts=(document.fonts&&document.fonts.ready)?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,700))]):Promise.resolve();
    fonts.then(()=>{
      bar.style.width='82%';
      const wait=Math.max(0,560-(performance.now()-t0));
      setTimeout(()=>{
        bar.style.width='100%';
        setTimeout(()=>{
          ind.done=false;ind();segs.forEach(x=>x.place());
          bootEl.classList.add('done');ROOT.classList.remove('booting');   // page entrance animations start now, under the fading loader
          setTimeout(()=>bootEl.remove(),700);
        },260);
      },wait);
    });
  }
})();
})();
